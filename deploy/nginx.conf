# 《钢铁突击》Nginx 站点配置 —— 阿里云 ECS + 已备案域名
#
#   域名：roguetank.i1978.com
#   Node：127.0.0.1:5173（只监听回环，公网只能经 Nginx 进来）
#
# 用法：
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/roguetank.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 证书由 Certbot 自动写入（见 deploy/certbot-setup.sh），不要在云控制台手动改
# 这个文件里的 ssl_certificate 路径——续期后路径不变，只换文件内容。

# ---------------------------------------------------------------- 上游
upstream tank_node {
    server 127.0.0.1:5173;
    keepalive 32;
}

# ---------------------------------------------------------------- 限流
# 定义必须放在 server 块外面，放进去会报 "directive is not allowed here"
limit_req_zone $binary_remote_addr zone=tankapi:10m rate=20r/s;

# ---------------------------------------------------------------- 80
# 只管两件事：ACME 验证（续期时用）和 301 跳转到 HTTPS。
# certbot --nginx 会自动往这里插一段 location /.well-known/acme-challenge/。
server {
    listen 80;
    listen [::]:80;
    server_name roguetank.i1978.com;

    # 续期验证必须走明文 80，且不能被跳转吃掉
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------- 443
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name roguetank.i1978.com;

    # ---- 证书（Certbot 管理）----
    ssl_certificate     /etc/letsencrypt/live/roguetank.i1978.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roguetank.i1978.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/roguetank.i1978.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # 关掉 session ticket：常用会话恢复靠上面的 cache，ticket 泄露会危及前向保密
    ssl_session_tickets off;

    # ---- 基础安全头 ----
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # 联机靠同源 WebSocket，不需要任何外部脚本
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 前端是原生 ES Module，不打包，所以根目录就是站点目录
    root /opt/roguetank;
    index index.html;

    # 上传体积限制：榜单只提交分数，1MB 绰绰有余，挡住大包攻击
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;

    # ---------------- 屏蔽内部文件 ----------------
    # 站点根目录就是代码目录，这些路径永远不该对公网开放。
    # Node 侧也有一份白名单（server.mjs），这里是 Nginx 直出静态文件时的兜底。
    location ^~ /.data/      { return 404; }
    location ^~ /server/     { return 404; }
    location ^~ /test/       { return 404; }
    location ^~ /deploy/     { return 404; }
    location ^~ /functions/  { return 404; }
    location ^~ /docs/       { return 404; }
    location ^~ /.git/       { return 404; }
    # 根目录下的杂项文件：配置文件、文档、测试、脚本
    #
    # 这里必须是"默认拒绝 + 白名单放行"，不能写成一个个 deny：
    # 每加一个文件就要记得来改 nginx，漏一个就把源码晾在公网上了。
    # 规则：根目录下只放行页面与静态资源，其余一律 404。
    #
    # 坑：这里的正则不能写成 ^/[^/]+$——它会连 /ws 一起匹配（ws 也是根目录下的"文件"），
    # 而 ~ 正则的优先级高于 /ws 的前缀匹配，结果就是 WebSocket 直接 404。
    # 所以必须显式把 /ws 排除掉。
    location ~ ^/(?!ws$)[^/]+$ {
        # 这里不能嵌套 location（Nginx 不允许 regex 里再套），
        # 只能"先全拒，再用上面的 = 精确放行"——精确匹配优先级最高，会先命中。
        return 404;
    }

    # 根目录下允许直接访问的文件（精确匹配，优先于上面那条正则）
    #
    # 注意不能写成空块 `{ }`：空块会让请求落到后面的正则/前缀 location，
    # 于是 /package.json 反而可能被静态规则接走。必须显式给 body。
    location = /index.html       { add_header Cache-Control "no-cache" always; }
    location = /styles.css       { add_header Cache-Control "no-cache" always; etag on; }
    location = /favicon.ico      { expires 7d; }
    location = /robots.txt       { expires 7d; }
    location = /site.webmanifest { expires 7d; }

    # ---------------- 页面 ----------------
    # HTML 必须 no-cache（在上面的精确匹配里已设置），否则发版后玩家还看着旧版

    # 静态资源带 ETag：没改动返回 304（几百字节），不打 Node
    #
    # 注意两处坑：
    #   1. root 是 /opt/roguetank，而 git 部署时代码也确实在这，能直出；
    #      但用压缩包部署时目录结构未必一致，所以 try_files 命不中必须回落到
    #      @node，而不是直接 404——否则页面能开、CSS 全丢，是最费解的故障。
    #   2. 任何 proxy_pass 的 location 里都不能写 root/try_files，混用会让
    #      Node 收到一个被 Nginx 改写过的 URI，静态文件一律 404。
    #   3. /test/ /server/ 之类目录里也有 .js/.mjs，必须显式排除，
    #      否则它们会被这条正则接住并从磁盘直出（实测 /test/net.test.mjs 能下载）。
    location ~* ^/(?!test/|server/|deploy/|functions/|docs/|assets_build/).*\.(js|mjs|css|png|jpg|jpeg|svg|ico|woff2)$ {
        add_header Cache-Control "no-cache" always;
        etag on;
        try_files $uri @node;
    }

    location @node {
        proxy_pass http://tank_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------- 榜单接口 ----------------
    location /api/ {
        limit_req zone=tankapi burst=40 nodelay;
        proxy_pass http://tank_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 没这行，Node 侧看不出请求其实是 HTTPS
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # ---------------- 健康检查 ----------------
    location = /healthz {
        proxy_pass http://tank_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # 房间概览只给本机运维看，公网 404
    location = /api/rooms {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://tank_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ---------------- WebSocket ----------------
    # 四个关键点，少一个都会表现为"连不上 / 打着打着掉线"
    location /ws {
        proxy_pass http://tank_node;
        proxy_http_version 1.1;
        # 1. Upgrade / Connection 必须透传，否则握手降级成普通 HTTP，客户端 400
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 2. 读超时：默认 60s 会把"在房间里发呆"的玩家踢掉
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # 3. 缓冲必须关：快照 15Hz 攒在 Nginx 里就变成一阵一阵的
        proxy_buffering off;
        # 4. 不要给 WS 加重试，重试只会叠出多个半开连接
        proxy_next_upstream off;
    }

    # 其余路径全交给 Node（免得新增文件还要改 Nginx）
    location / {
        proxy_pass http://tank_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
