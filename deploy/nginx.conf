# 可选的 Nginx 反代配置。
#
# 纯 IP + 只用 Node 直连的话，这个文件用不上。
# 什么时候需要它：
#   1. 以后有了域名，想用 80/443 标准端口
#   2. 想用 Nginx 做 gzip / 限流 / 多站点
#
# 用法：
#   cp deploy/nginx.conf /etc/nginx/conf.d/roguetank.conf
#   改 server_name 与证书路径
#   nginx -t && systemctl reload nginx
# 同时把 roguetank.service 里的 HOST 改成 127.0.0.1、PORT 改成 5173。

upstream tank_node {
    server 127.0.0.1:5173;
    keepalive 32;
}

# ---- 纯 IP 场景：直接用 80 端口，不需要证书 ----
server {
    listen 80 default_server;
    server_name _;

    # 静态文件由 Nginx 直出，Node 只处理 /ws 与 /api
    root /opt/roguetank;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # HTML 必须 no-cache，发版后才能立刻生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 静态资源协商缓存：命中返回 304（几十字节），不打 Node
    location ~* \.(js|mjs|css|png|jpg|svg|woff2)$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        etag on;
    }

    # 榜单接口
    location /api/ {
        proxy_pass http://tank_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 健康检查不记日志，避免探活刷满磁盘
    location = /healthz {
        proxy_pass http://tank_node;
        access_log off;
    }

    # WebSocket 房间：三个关键点少一个都连不上
    location /ws {
        proxy_pass http://tank_node;
        proxy_http_version 1.1;
        # 1. Upgrade / Connection 必须透传，否则握手变普通 HTTP
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 2. 读超时要放宽，默认 60s 会把正在进行的对局断掉
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # 3. 关闭缓冲：快照要低延迟，攒在 Nginx 里就变成一顿一顿
        proxy_buffering off;
    }

    # 简单的防刷：单 IP 每秒 20 个请求，突发 40
    limit_req_zone $binary_remote_addr zone=tankapi:10m rate=20r/s;
    location ~ ^/api/scores$ {
        limit_req zone=tankapi burst=40 nodelay;
        proxy_pass http://tank_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

