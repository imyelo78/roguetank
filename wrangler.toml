# Cloudflare Worker 配置（替代原来的 Pages 部署）
#
# 一个 Worker 同时提供：静态页面（dist）、榜单接口（KV）、联机房间（Durable Object）。
# 这样网页和 /ws 同源，前端不需要配置任何服务器地址。
#
# 首次部署：
#   1. npm run build            # 产出 dist/
#   2. npx wrangler login       # 或设置 CLOUDFLARE_API_TOKEN
#   3. npx wrangler deploy
#
# 榜单想持久化的话，先建一个 KV 命名空间，再把下面的 [[kv_namespaces]] 取消注释：
#   npx wrangler kv namespace create DAILY_SCORES
# 没建也能跑，只是成绩存浏览器本地（前端自动回退）。

name = "roguetank"
main = "worker/index.js"
compatibility_date = "2025-01-01"

# 静态资源：由 npm run build 生成到 dist/
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[observability]
enabled = true

# 房间：一个房间码 = 一个 Durable Object 实例
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]

# 榜单存储：KV 里的 key 是 lb:<日期> 与 all:top，规则见 functions/api/_lib/leaderboard.js
[[kv_namespaces]]
binding = "DAILY_SCORES"
id = "d9eeb3ef5c284114bca6dd457bd225c8"
